<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D1 Drive — Cloud Storage</title>
<meta name="description" content="Personal cloud drive on Cloudflare Pages + D1, with WebDAV support.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M46 26a14 14 0 0 0-27-4A12 12 0 0 0 20 46h24a10 10 0 0 0 2-20z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg-fx" aria-hidden="true"></div>

<div id="app">
  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside class="sidebar glass">
    <div class="logo">
      <svg viewBox="0 0 64 64" width="30" height="30"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path fill="url(#lg)" d="M46 26a14 14 0 0 0-27-4A12 12 0 0 0 20 46h24a10 10 0 0 0 2-20z"/></svg>
      <span>D1&nbsp;Drive</span>
    </div>

    <button id="btn-upload" class="btn primary block">
      <svg viewBox="0 0 24 24"><path d="M12 16V5m0 0l-4 4m4-4l4 4M5 19h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Upload files
    </button>
    <input type="file" id="file-input" multiple hidden>

    <button id="btn-mkdir" class="btn ghost block">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7zm9 4v5m-2.5-2.5h5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      New folder
    </button>

    <div class="side-spacer"></div>

    <div class="storage card">
      <svg id="ring" width="84" height="84" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" class="ring-bg"/>
        <circle cx="50" cy="50" r="42" class="ring-fg" id="ring-fg"/>
        <text x="50" y="54" text-anchor="middle" class="ring-label" id="ring-pct">—</text>
      </svg>
      <div class="storage-meta">
        <strong id="storage-used">…</strong>
        <span id="storage-files">— files · — folders</span>
        <small>Cloudflare D1 · 10 GB class limit</small>
      </div>
    </div>

    <details class="dav-help card">
      <summary>WebDAV endpoint</summary>
      <code id="dav-url">/dav/</code>
      <p>Mount this URL in Finder, Windows Explorer, Cyberduck or rclone.</p>
    </details>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <nav id="breadcrumbs" class="crumbs" aria-label="Breadcrumb"></nav>
      <div class="top-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.5-4.5"/></svg>
          <input id="search" type="search" placeholder="Filter current folder…" autocomplete="off">
        </div>
        <select id="sort" title="Sort">
          <option value="name-asc">Name ↑</option>
          <option value="name-desc">Name ↓</option>
          <option value="size-desc">Largest</option>
          <option value="date-desc">Newest</option>
          <option value="date-asc">Oldest</option>
        </select>
        <button id="btn-view" class="icon-btn" title="Toggle view"></button>
      </div>
    </header>

    <div id="bulkbar" class="bulkbar glass" hidden>
      <span id="bulk-count"></span>
      <div class="bulk-actions">
        <button id="bulk-move" class="btn small">Move…</button>
        <button id="bulk-delete" class="btn small danger">Delete</button>
        <button id="bulk-clear" class="btn small ghost">Clear</button>
      </div>
    </div>

    <section id="content" tabindex="-1">
      <div id="grid" class="grid"></div>
      <div id="list-wrap" hidden>
        <table class="list">
          <thead><tr><th></th><th>Name</th><th>Size</th><th>Modified</th><th></th></tr></thead>
          <tbody id="list-body"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>
        <svg viewBox="0 0 120 90" width="150"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><path fill="none" stroke="url(#eg)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" d="M85 62H35a18 18 0 0 1-3-36 25 25 0 0 1 48-6 16 16 0 0 1 5 42z"/><path stroke="url(#eg)" stroke-width="3" stroke-linecap="round" d="M60 44v22m0-22l-8 8m8-8l8 8"/></svg>
        <p>This folder is empty</p>
        <small>Drop files anywhere, or use “Upload files”.</small>
      </div>
      <div id="skeleton" class="skeleton-grid" hidden></div>
    </section>
  </main>
</div>

<!-- ── Drag & drop overlay ───────────────────────────────────── -->
<div id="drop-overlay" hidden>
  <div class="drop-box glass">
    <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 20h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Drop to upload here</span>
  </div>
</div>

<div id="ctxmenu" class="ctxmenu glass" hidden></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<aside id="upload-tray" class="glass" hidden>
  <header>Uploads <button id="tray-close" class="icon-btn tiny" title="Hide">×</button></header>
  <div id="upload-list"></div>
</aside>

<script src="/app.js"></script>
</body>
</html>
